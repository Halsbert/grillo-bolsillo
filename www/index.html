<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grillo">
<title>GRILLO de bolsillo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root, [data-theme="grafito"] {
  --mono: "JetBrains Mono", "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --board: #1b1f22; --board2: #22272b; --board3: #2a3035; --line: rgba(233, 228, 212, .11);
  --silk: #ebe6d6; --silk-d: rgba(235, 230, 214, .6); --silk-f: rgba(235, 230, 214, .16); --silk-ff: rgba(235, 230, 214, .06);
  --copper: #caa35a; --accent: #ff5a1f; --accent2: #ffc23d;
  --key1: #ebe7dc; --key2: #cbc6b9; --keyedge: #8a857a; --ink: #23272a; --ink-d: rgba(35, 39, 42, .5);
  --lcd1: #c9cfb8; --lcd2: #b3bba0; --lcdink: rgba(22, 26, 19, .9);
  --cap1: #f4f1ea; --cap2: #c2bdb1; --shadow: rgba(0, 0, 0, .38);
}
[data-theme="verde"] {
  --board: #0f3528; --board2: #133f30; --board3: #184b3a; --line: rgba(242, 239, 226, .13);
  --silk: #f2efe2; --silk-d: rgba(242, 239, 226, .62); --silk-f: rgba(242, 239, 226, .18); --silk-ff: rgba(242, 239, 226, .07);
  --copper: #d9b468; --shadow: rgba(0, 0, 0, .4);
}
[data-theme="hueso"] {
  --board: #e6e1d4; --board2: #eeeae0; --board3: #f6f3ec; --line: rgba(30, 30, 28, .13);
  --silk: #262624; --silk-d: rgba(38, 38, 36, .62); --silk-f: rgba(38, 38, 36, .17); --silk-ff: rgba(38, 38, 36, .06);
  --copper: #b8913f; --key1: #fdfcf8; --key2: #e4e0d5; --keyedge: #aaa497; --shadow: rgba(60, 50, 30, .22);
  --cap1: #ffffff; --cap2: #d6d1c5;
}

/* ══════════════════════════════════════════════════════════════════
   GRILLO DE BOLSILLO · estilos (los colores de los temas vienen de la
   versión de ordenador: placa, serigrafía, teclas de goma y LCD)
   ══════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: radial-gradient(circle at 1px 1px, var(--silk-ff) 1px, transparent 1.6px) 0 0 / 20px 20px, var(--board);
  color: var(--silk); font: 400 11px/1.35 var(--mono); user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
button { font-family: var(--mono); color: inherit; }
#root { height: 100%; }
#ov { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#ov > * { pointer-events: auto; }
.sp { flex: 1; }
.note { color: var(--silk-d); margin: 4px 0; font-size: 10px; line-height: 1.45; }
.led { width: 6px; height: 6px; border-radius: 50%; background: #5a2f25; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .45); flex: none; display: block; }
.on > .led, .led.on { background: var(--accent); box-shadow: 0 0 7px 1px rgba(255, 90, 31, .85), inset 0 0 1px #fff; }

#m {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px); touch-action: none;
}
/* cabecera */
#mh { display: flex; align-items: center; gap: 8px; height: 34px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; }
.logo svg { width: 38px; height: 25px; stroke: var(--silk); fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; display: block; }
.logo .eye { fill: var(--silk); stroke: none; }
.bt b { display: block; font: 800 16px/1 var(--mono); letter-spacing: .3em; }
.bt i { display: block; font: 400 7px/1 var(--mono); letter-spacing: .2em; color: var(--silk-d); font-style: normal; margin-top: 4px; }
.ib { width: 38px; height: 32px; border: 0; border-radius: 8px; background: var(--board3); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.ib svg { width: 17px; height: 17px; stroke: var(--silk); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.ib.lock svg rect { fill: var(--silk-f); }
.ib:active { transform: translateY(1px); }

/* pantalla */
.lcdwrap { flex: none; align-self: center; padding: 7px 7px 4px; border-radius: 12px; background: linear-gradient(180deg, #111315, #1a1d20); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), 0 10px 24px var(--shadow), 0 1px 0 rgba(255, 255, 255, .07); }
.lcdwrap canvas { display: block; width: var(--lw) !important; height: var(--lh) !important; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .7); }
.lcdlbl { display: flex; justify-content: space-between; font: 400 7px var(--mono); letter-spacing: .18em; color: rgba(235, 230, 214, .38); margin-top: 4px; padding: 0 2px; }

/* faders */
#mf { flex: none; padding: 6px 8px 8px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); background: linear-gradient(180deg, rgba(0, 0, 0, .1), transparent); }
#mf.plock { box-shadow: inset 0 0 0 1.5px var(--accent2); }
.fhead { display: flex; align-items: center; gap: 6px; height: 24px; }
.fhead #fName { flex: 1; text-align: center; font: 700 9.5px var(--mono); letter-spacing: .12em; color: var(--silk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fpg { width: 34px; height: 24px; border: 0; border-radius: 6px; background: var(--board3); box-shadow: inset 0 0 0 1px var(--line); font: 700 16px/1 var(--mono); color: var(--silk); }
.fpg:active { background: var(--silk-f); }
.tilt { height: 24px; border: 0; border-radius: 6px; background: transparent; box-shadow: inset 0 0 0 1px var(--silk-f); color: var(--silk-d); font: 700 8px var(--mono); letter-spacing: .1em; display: flex; align-items: center; gap: 5px; padding: 0 7px; }
.tilt.on { color: var(--silk); }
.frow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.fd { display: flex; flex-direction: column; align-items: center; gap: 4px; touch-action: none; --v: 0; }
.fl { font: 700 8px/1 var(--mono); letter-spacing: .1em; color: var(--silk-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; height: 9px; }
.ft { position: relative; width: 100%; height: 84px; border-radius: 8px; }
.ft::before { content: ''; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 6px; margin-left: -3px; border-radius: 3px; background: #0f1113; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .07); }
.ft::after { content: ''; position: absolute; left: 18%; right: 18%; top: 6px; bottom: 6px; background: repeating-linear-gradient(180deg, var(--silk-f) 0 1px, transparent 1px 9px); pointer-events: none; opacity: .7; z-index: 0; }
.ft .fill { position: absolute; left: 50%; bottom: 6px; width: 6px; margin-left: -3px; border-radius: 3px; height: calc((100% - 12px) * var(--v)); background: var(--accent); opacity: .75; z-index: 1; }
.ft .fc { position: absolute; left: 50%; width: 30px; height: 16px; margin-left: -15px; bottom: calc(6px + (100% - 12px - 16px) * var(--v) - 0px); border-radius: 4px; z-index: 2;
  background: linear-gradient(180deg, var(--key1), var(--key2)); box-shadow: 0 2px 0 var(--keyedge), 0 4px 8px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .8); }
.ft .fc::after { content: ''; position: absolute; left: 5px; right: 5px; top: 7px; height: 2px; border-radius: 1px; background: var(--ink-d); }
.fd.act .fc { background: linear-gradient(180deg, #ffb08a, var(--accent)); }
.fd.lock .fc::after { background: var(--accent2); height: 3px; }
.fv { font: 700 9px/1 var(--mono); color: var(--silk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; height: 10px; }
.fd.off { opacity: .3; }

/* modos */
#mm { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mode { height: 34px; border: 0; border-radius: 7px; background: var(--board3); box-shadow: inset 0 0 0 1px var(--line); color: var(--silk-d); font: 700 8.5px/1 var(--mono); letter-spacing: .08em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
.mode.on { color: var(--silk); background: linear-gradient(180deg, var(--board3), var(--board2)); box-shadow: inset 0 0 0 1px var(--silk-f), 0 0 0 1px var(--accent); }
.mode.on .led { background: var(--accent); box-shadow: 0 0 7px 1px rgba(255, 90, 31, .85); }

/* rejilla de 16 teclas */
#mg { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 7px; touch-action: none; }
.gk {
  position: relative; border-radius: 10px; padding: 6px 7px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(180deg, var(--key1), var(--key2)); color: var(--ink);
  box-shadow: 0 3px 0 var(--keyedge), 0 6px 12px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .8); transition: transform .04s, box-shadow .04s;
}
.gk.dn { transform: translateY(2px); box-shadow: 0 1px 0 var(--keyedge), 0 2px 5px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .6); }
.gk .gl { font: 700 8.5px/1 var(--mono); color: var(--ink-d); letter-spacing: .06em; }
.gk .gn { font: 700 10.5px/1.1 var(--mono); letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gk .gs { font: 400 7.5px/1 var(--mono); color: var(--ink-d); letter-spacing: .05em; white-space: nowrap; overflow: hidden; min-height: 8px; }
.gk .led { position: absolute; top: 7px; right: 7px; }
.gk.on .led, .gk.hit .led, .gk.lv .led { background: var(--accent); box-shadow: 0 0 8px 2px rgba(255, 90, 31, .85); }
.gk.sel { box-shadow: 0 3px 0 var(--keyedge), 0 6px 12px var(--shadow), 0 0 0 2px var(--board), 0 0 0 4px var(--accent2); }
.gk.out { opacity: .22; pointer-events: none; }
.gk.empty .gn { color: var(--ink-d); font-weight: 400; }
.gk.mute { opacity: .5; }
.gk.blk { background: linear-gradient(180deg, #4a4f53, #33373a); color: var(--key1); }
.gk.blk .gs, .gk.blk .gl { color: rgba(235, 231, 220, .55); }
.gk.lock::after { content: ''; position: absolute; left: 7px; bottom: 7px; width: 7px; height: 7px; border-radius: 2px; background: var(--accent2); }
.gk.lock .gs { padding-left: 11px; }
/* en PASOS las teclas apagadas son huecos de la placa, como en el ordenador */
#mg[data-m="steps"] .gk:not(.on) { background: var(--board3); color: var(--silk-d); box-shadow: inset 0 0 0 1px var(--line); }
#mg[data-m="steps"] .gk:not(.on) .gl { color: var(--silk-d); }
#mg[data-m="steps"] .gk.ph { box-shadow: 0 0 0 2px var(--accent), 0 3px 0 var(--keyedge); }
#mg[data-m="steps"] .gk:not(.on).ph { box-shadow: inset 0 0 0 2px var(--accent); }
#mg[data-m="steps"] .gk.ph .led { background: var(--accent); box-shadow: 0 0 9px 2px rgba(255, 90, 31, .9); }
#mg[data-m="steps"] .gk.sel { box-shadow: 0 0 0 3px var(--accent2), 0 3px 0 var(--keyedge); }
#mg[data-m="pat"] .gk.ph .led { background: var(--accent); box-shadow: 0 0 9px 2px rgba(255, 90, 31, .9); }
#mg[data-m="fx"] .gk .gn { font-size: 9.5px; white-space: normal; line-height: 1.15; }

/* pie */
#mb { flex: none; display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 7px; }
.fk {
  position: relative; height: 52px; border: 0; border-radius: 9px; padding: 6px 7px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 3px; text-align: left;
  background: linear-gradient(180deg, var(--key1), var(--key2)); color: var(--ink);
  box-shadow: 0 3px 0 var(--keyedge), 0 6px 12px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .8);
}
.fk.dn, .fk:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--keyedge), 0 2px 5px var(--shadow); }
.fk b { font: 700 10px/1 var(--mono); letter-spacing: .07em; white-space: nowrap; }
.fk i { font: 400 7px/1.2 var(--mono); color: var(--ink-d); font-style: normal; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.fk .led { position: absolute; top: 7px; right: 7px; }
.fk.on .led { background: var(--accent); box-shadow: 0 0 8px 2px rgba(255, 90, 31, .85); }
.fk.dis { opacity: .45; }
.fk.rec b { color: #b3260a; }
.fk.rec.mic { background: linear-gradient(180deg, #ff8a5c, var(--accent)); color: #fff; }
.fk.rec.mic b, .fk.rec.mic i { color: #fff; }
.fk.play { align-items: center; }
.fk.play .ico svg { width: 16px; height: 16px; fill: var(--ink); display: block; }
.fk.play.on { background: linear-gradient(180deg, #ff8a5c, var(--accent)); color: #fff; }
.fk.play.on .ico svg { fill: #fff; }

/* bloqueo */
#lockov { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-end; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom) + 30px); background: rgba(10, 12, 13, .35); touch-action: none; }
body.locked #lockov { display: flex; }
.lk { text-align: center; background: var(--board2); padding: 14px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--line); width: 78%; }
.lk b { display: block; font: 800 13px var(--mono); letter-spacing: .3em; }
.lk i { display: block; font: 400 8px var(--mono); letter-spacing: .14em; color: var(--silk-d); font-style: normal; margin-top: 6px; }
.lkbar { height: 5px; border-radius: 3px; background: var(--board3); margin-top: 10px; overflow: hidden; }
.lkbar i { display: block; height: 100%; width: 0; background: var(--accent); margin: 0; }

/* hojas desde abajo */
.shbg { position: absolute; inset: 0; background: rgba(0, 0, 0, 0); display: flex; align-items: flex-end; justify-content: center; transition: background .18s; }
.shbg.in { background: rgba(0, 0, 0, .45); }
.sheet { width: 100%; max-width: 560px; max-height: 82%; display: flex; flex-direction: column; background: var(--board2); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--line);
  transform: translateY(100%); transition: transform .2s ease-out; padding-bottom: env(safe-area-inset-bottom); }
.shbg.in .sheet { transform: none; }
.sheet.tall { max-height: 92%; }
.shh { display: flex; align-items: center; padding: 12px 14px 8px; gap: 10px; }
.shh b { flex: 1; font: 800 11px var(--mono); letter-spacing: .2em; }
.shx { width: 34px; height: 30px; border: 0; border-radius: 8px; background: var(--board3); font-size: 18px; line-height: 1; }
.shb { padding: 4px 14px 16px; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.row { text-align: left; border: 0; border-radius: 9px; background: var(--board3); box-shadow: inset 0 0 0 1px var(--line); padding: 13px 12px; font: 700 11px var(--mono); letter-spacing: .03em; }
.row:active { background: var(--silk-f); }
.row.dis { opacity: .4; pointer-events: none; }
.row.danger { color: #ff7a52; }
.row.pri { background: linear-gradient(180deg, #ff8a5c, var(--accent)); color: #fff; box-shadow: none; }
.row.smp { display: flex; justify-content: space-between; gap: 10px; }
.row.smp i { font-style: normal; font-weight: 400; color: var(--silk-d); font-size: 9px; white-space: nowrap; }
.menu h4 { font: 700 9px var(--mono); letter-spacing: .16em; color: var(--copper); margin: 14px 0 8px; }
.menu .help p { font-size: 10.5px; line-height: 1.5; color: var(--silk-d); margin: 0 0 8px; }
.menu .help b { color: var(--silk); }
.note.ver { margin-top: 14px; font-size: 8.5px; opacity: .7; }
.srow { margin-bottom: 11px; }
.srow > label { display: block; font: 700 9px var(--mono); letter-spacing: .06em; color: var(--silk-d); margin-bottom: 6px; }
.seg { display: flex; flex-wrap: wrap; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--silk-f); }
.seg button { flex: 1 1 auto; background: transparent; color: var(--silk-d); border: 0; font: 700 9.5px/1 var(--mono); letter-spacing: .06em; padding: 10px 9px; border-right: 1px solid var(--silk-ff); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--silk); color: var(--board); }
/* exportar (el mismo diálogo que en el ordenador) */
.export .ewhat { margin: -2px 0 12px; color: var(--silk); }
.export .ewarn { color: var(--accent); }
.export .zf { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.export .ever { margin-right: auto; font-size: 9px; letter-spacing: .08em; color: var(--silk); opacity: .6; }
.pbar { height: 6px; border-radius: 3px; background: var(--board3); overflow: hidden; margin: 10px 0; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.mk { height: 44px; padding: 0 18px; border: 0; border-radius: 9px; background: linear-gradient(180deg, var(--key1), var(--key2)); color: var(--ink); font: 700 11px/1 var(--mono); letter-spacing: .1em; box-shadow: 0 2px 0 var(--keyedge), 0 4px 9px var(--shadow); }
.mk.pri { background: linear-gradient(180deg, #ff8a5c, var(--accent)); color: #fff; box-shadow: 0 2px 0 #a93611, 0 4px 9px var(--shadow); }
.mk:disabled { opacity: .5; }

/* arranque */
#power { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 1px 1px, rgba(235, 230, 214, .06) 1px, transparent 1.6px) 0 0 / 20px 20px, #1b1f22; color: #ebe6d6; padding: 24px; }
.pw { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pw svg { width: 170px; height: 106px; stroke: #ebe6d6; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.pw svg .eye { fill: #ebe6d6; stroke: none; }
.pw h1 { font: 800 38px/1 var(--mono); letter-spacing: .45em; margin: 0 0 0 .45em; }
.pw .sub { font: 400 9px var(--mono); letter-spacing: .34em; color: rgba(235, 230, 214, .6); margin: 0; }
.pw .key { height: 54px; padding: 0 30px; margin-top: 18px; border: 0; border-radius: 10px; display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #ebe7dc, #cbc6b9); color: #23272a; font: 700 13px var(--mono); letter-spacing: .25em; box-shadow: 0 3px 0 #8a857a, 0 6px 14px rgba(0, 0, 0, .4); }
.pw .key .led { background: var(--accent); box-shadow: 0 0 7px 1px rgba(255, 90, 31, .85); }
.pw .note { max-width: 300px; color: rgba(235, 230, 214, .6); }
#power.booting .key { opacity: .6; }

/* pantallas bajas */
body.cmp #m { gap: 6px; }
body.cmp .ft { height: 62px; }
body.cmp .fk { height: 46px; }
body.cmp .mode { height: 30px; gap: 4px; }
body.cmp #mf { padding: 4px 8px 6px; }
body.xs .ft { height: 50px; }
body.xs .fk { height: 42px; }
body.xs .fk i { display: none; }
body.xs .fhead { height: 22px; }
body.xs #mh { height: 30px; }
body.edge #m { padding-top: 32px; padding-bottom: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="ov"></div>
<div id="power">
  <div class="pw">
    <svg viewBox="0 0 96 60"><path d="M21 24 Q11 6 2 5 M24 23 Q20 5 11 1"/><circle cx="27" cy="30" r="9.5"/><circle cx="24" cy="27.6" r="2.3" class="eye"/><path d="M35 31 Q54 16 75 31 Q54 44 35 31"/><path d="M40 27 Q57 18 73 27"/><path d="M60 36 L75 19 L86 45 M38 39 L33 50 M47 41 L47 52"/></svg>
    <h1>GRILLO</h1>
    <p class="sub">DE BOLSILLO · S-16</p>
    <button id="pwBtn" class="key"><span class="led"></span>ENCENDER</button>
    <p class="note">Toca para encender el sonido. El micro solo se pide la primera vez que grabes. Todo se guarda en el móvil.</p>
  </div>
</div>
<script>'use strict';
/* ══════════════════════════════════════════════════════════════════
   GRILLO · núcleo compartido (hilo de audio y hilo principal)
   Parámetros, valores por defecto, tablas y efectos.
   ══════════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const BS = 128;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const dbg = (db) => Math.pow(10, db / 20);
const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
/* tanh rápida (Padé), exacta en ±3 y saturada fuera */
function ftanh(x) { if (x > 3) return 1; if (x < -3) return -1; const x2 = x * x; return (x * (27 + x2)) / (27 + 9 * x2); }

function mkP(id, label, min, max, def, curve, extra) {
  const p = { id, label, min, max, def, curve: curve || 'lin', unit: '', opts: null };
  if (Array.isArray(extra)) { p.opts = extra; p.min = 0; p.max = extra.length - 1; }
  else if (extra != null) p.unit = extra;
  p.modable = p.curve === 'lin' || p.curve === 'exp' || p.curve === 'int';
  p.lmin = p.curve === 'exp' ? Math.log(p.min) : 0;
  p.lr = p.curve === 'exp' ? Math.log(p.max / p.min) : 1;
  p.bip = p.min < 0 && p.max > 0;
  return p;
}
function pNorm(p, v) {
  if (v == null || isNaN(v)) v = p.def;
  if (p.curve === 'exp') return clamp((Math.log(Math.max(v, p.min)) - p.lmin) / p.lr, 0, 1);
  return p.max === p.min ? 0 : clamp((v - p.min) / (p.max - p.min), 0, 1);
}
function pDen(p, n) {
  n = n < 0 ? 0 : n > 1 ? 1 : n;
  if (p.curve === 'exp') return Math.exp(p.lmin + n * p.lr);
  const v = p.min + n * (p.max - p.min);
  return p.curve === 'lin' ? v : Math.round(v);
}

    case 6: return cyc % 4 === 0; case 7: return cyc % 4 === 1; case 8: return cyc % 4 === 2; case 9: return cyc % 4 === 3;

function laneVal(lane, x) {
  const pts = lane.pts, n = pts.length; if (!n) return -1;
  if (n === 1) return pts[0][1];
  const len = lane.len;
  x = ((x % len) + len) % len;
  let i = n - 1;
  for (let j = 0; j < n; j++) { if (pts[j][0] > x) { i = j - 1; break; } }
  let a, b, ta, tb;
  if (i < 0) { a = pts[n - 1]; b = pts[0]; ta = a[0] - len; tb = b[0]; }
  else if (i === n - 1) { a = pts[n - 1]; b = pts[0]; ta = a[0]; tb = b[0] + len; }
  else { a = pts[i]; b = pts[i + 1]; ta = a[0]; tb = b[0]; }
  const c = a[2] || 0;
  if (c >= 2) return a[1];
  let f = tb > ta ? (x - ta) / (tb - ta) : 0;
  if (c > 0) f = Math.pow(f, 1 + c * 4); else if (c < 0) f = 1 - Math.pow(1 - f, 1 - c * 4);
  return a[1] + (b[1] - a[1]) * f;
}

    this.samples.set(id, s);
    AU.send({ t: 'sample', id, L, R, sr: m.sr, wt: an.wt, part: an.part });
    return s;
  },
  async addSample(name, sr, L, R, src, fixedId) {
    const id = fixedId || 's' + uid();
    const an = AN.analyze(L, R || L, sr);
    const s = { id, name: String(name).toUpperCase().slice(0, 24), sr, L, R: R || L, an, src: src || 'ARCHIVO', created: Date.now() };
    this.samples.set(id, s);
    AU.send({ t: 'sample', id, L: s.L, R: s.R, sr, wt: an.wt, part: an.part });
    const meta = { id, name: s.name, sr, dur: L.length / sr, src: s.src, created: s.created, bpm: an.bpm, key: an.key, slices: an.slices, feat: an.feat, root: an.root, cents: an.cents, mini: Array.from(AN.peaks(L, R, 64)) };
    this.lib = this.lib.filter((x) => x.id !== id); this.lib.push(meta);
    DB.put('meta', meta); DB.put('data', { id, L: s.L, R: s.R === s.L ? null : s.R });
    return s;
  },
  async deleteSample(id) {
    const used = this.P.sounds.some((s) => s.zones.some((z) => z.sid === id));
    if (used) { this.msg('EN USO: NO SE BORRA'); return false; }
    this.lib = this.lib.filter((x) => x.id !== id); this.samples.delete(id);
    AU.send({ t: 'unsample', id }); await DB.del('meta', id); await DB.del('data', id); return true;
  },
  async assign(si, sid, layer) {
    const sm = await this.loadSample(sid); if (!sm) return;
    const s = this.P.sounds[si], mel = s.mode === 'mel';
    const z = { sid, root: mel ? sm.an.root : 60, cents: mel ? sm.an.cents : 0, lo: 0, hi: 127, vlo: 0, vhi: 127 };
    if (layer && s.zones.length) s.zones.push(z); else s.zones[0] = z;
    if (!layer) { s.slices = s.mode === 'chop' ? (sm.an.slices.length > 1 || !this.set.slice ? sm.an.slices.slice() : [0]) : [0]; s.p.start = 0; s.p.len = 1; }
    if (!s.name || /^SONIDO \d+$/.test(s.name)) s.name = sm.name.slice(0, 14);
    this.touchS(si); this.commit(); UI.renderAll(); LV.focusWave();
  },
  async importFiles(files, si) {
    si = si == null ? (this.sel >= 0 ? this.sel : 0) : si;
    let k = 0;
    for (const f of files) {
      if (!/^audio\//.test(f.type) && !/\.(wav|mp3|ogg|flac|m4a|aac|aif|aiff|webm|opus)$/i.test(f.name)) {
        if (/\.grillo$/i.test(f.name)) { await IO.openFile(f); return; }
        continue;
      }
      LV.message('ANALIZANDO…'); await new Promise((r) => setTimeout(r, 20));
      try {
        const buf = await AU.ctx.decodeAudioData(await f.arrayBuffer());
        const L = buf.getChannelData(0).slice(), R = buf.numberOfChannels > 1 ? buf.getChannelData(1).slice() : L;
        const sm = await this.addSample(f.name.replace(/\.[^.]+$/, ''), buf.sampleRate, L, R, 'ARCHIVO');
        const target = Math.min(15, si + k);
        if (files.length > 1 && k > 0) { await this.assign(target, sm.id); } else await this.assign(target, sm.id);
        k++;
      } catch (e) { console.warn(e); this.msg('NO SE PUEDE LEER ' + f.name.slice(0, 12)); }
    }
    UI.refreshLibrary();
  },

  /* ── grabación de muestras (micro o remuestreo) ── */
  async recStart(hold) {
    if (this.rec.on) return;
    if (this.sel < 0) { this.msg('ELIGE UN SONIDO'); return; }
    if (this.set.recSrc === 0 && !(await AU.enableMic())) return;
    this.rec = { on: true, chunksL: [], chunksR: [], len: 0, t0: performance.now(), hold, si: this.sel, wait: this.set.recThr < 0 };
    AU.send({ t: 'srec', on: true, src: this.set.recSrc, thr: this.set.recThr < 0 ? Math.pow(10, this.set.recThr / 20) : 0 });
    UI.refreshRec();
  },
  recStop() { if (!this.rec.on) return; AU.send({ t: 'srec', on: false }); },
  async recFinish() {
    const r = this.rec; r.on = false; UI.refreshRec();
    if (!r.len) { this.msg('NADA GRABADO'); return; }
    let L = new Float32Array(r.len), R = new Float32Array(r.len), o = 0;
    for (let i = 0; i < r.chunksL.length; i++) { L.set(r.chunksL[i], o); R.set(r.chunksR[i], o); o += r.chunksL[i].length; }
    if (this.set.trim) { const t = AN.trim(L, R, AU.sr, -50); if (!t) { this.msg('SOLO SILENCIO'); return; } L = L.slice(t[0], t[1]); R = R.slice(t[0], t[1]); }
    let same = true; for (let i = 0; i < L.length; i += 7) if (Math.abs(L[i] - R[i]) > 1e-4) { same = false; break; }
    if (same) R = L;
    else if (this.set.recMono) { L = IO.toMono(L, R); R = L; } // grabación en mono
    if (this.set.norm) AN.normalize(L, R === L ? null : R);
    const n = this.lib.filter((m) => m.src === 'MICRO' || m.src === 'REMUESTREO').length + 1;
    const d = new Date(), name = (this.set.recSrc ? 'REMUESTREO ' : 'MICRO ') + pad2(n) + ' ' + pad2(d.getHours()) + pad2(d.getMinutes());
    LV.message('ANALIZANDO…'); await new Promise((res) => setTimeout(res, 20));
    const sm = await this.addSample(name, AU.sr, L, R, this.set.recSrc ? 'REMUESTREO' : 'MICRO');
    await this.assign(r.si, sm.id);
    this.msg('GRABADO ' + (L.length / AU.sr).toFixed(1) + 'S');
    UI.refreshLibrary();
  },

  /* ── mensajes del motor ── */
  onEngine(d) {
    switch (d.t) {
      case 'st': this.st = d; if (d.pl) this.playPat = d.cur; break;
      case 'pat': this.playPat = d.cur; this.ci = d.ci; UI.refreshPatterns(); break;
      case 'recstep': {
        const tr = this.P.patterns[d.pi].tracks[d.i]; let st = tr.steps[d.k];
        if (!st) tr.steps[d.k] = newStep(d.n, d.v); else if (!st.n.includes(d.n)) st.n.push(d.n);
        this.markPat(d.pi, false); UI.refreshSteps(); UI.refreshPads(); break;
      }
      case 'recfx': { this.P.patterns[d.pi].master.fx[d.k] = d.id; this.markPat(d.pi, false); UI.refreshSteps(); break; }
      case 'recdata': this.rec.chunksL.push(d.L); this.rec.chunksR.push(d.R); this.rec.len += d.L.length; this.rec.wait = false; break;
      case 'recend': if (this.rec.exp) { const f = this.rec.exp; this.rec.exp = null; f(); } else this.recFinish(); break;
      case 'err': this.msg(d.msg.slice(0, 40)); console.warn(d.msg); break;
    }
  },
  msg(t) { LV.message(t); },

  /* ── sincronización con el motor (agrupada por cuadro) ── */
  touchS(i) { if (i < 0) this.dM = true; else this.dS.add(i); this.dirty(); },
  markPat(pi, send) { if (send !== false) this.dPat.add(pi); this.dirty(); },
  touchG() { this.dG = true; this.dirty(); },
  flush() {
    for (const i of this.dS) AU.send({ t: 'sound', i, s: this.P.sounds[i] });
    this.dS.clear();
    if (this.dM) { AU.send({ t: 'master', s: this.P.master }); this.dM = false; }
    for (const pi of this.dPat) AU.send({ t: 'pattern', i: pi, p: this.P.patterns[pi] });
    this.dPat.clear();
    if (this.dG) { const P = this.P; AU.send({ t: 'global', g: { bpm: P.bpm, swing: P.swing, metro: P.metro, chain: P.chain, chainMode: P.chainMode, cur: P.cur } }); this.dG = false; }
  },
  dirty() { clearTimeout(this.saveT); this.saveT = setTimeout(() => this.save(), 1500); },
  save() { if (this.P) DB.put('kv', JSON.stringify(this.P), 'project'); },
  commit() {
    const j = JSON.stringify(this.P);
    if (j === this.snap) return;
    this.hist.push(this.snap); if (this.hist.length > 120) this.hist.shift();
    this.snap = j; this.fut = []; UI.refreshUndo();
  },
  restore(j) {
    const sel = this.sel;
    if (UI.lfoEd) { UI.lfoEd = null; UI._modalClose = null; UI.closeModal(); }
    this.P = this.normalizeProject(JSON.parse(j)); this.snap = j;
    AU.send({ t: 'init', p: this.P });
    this.sel = Math.min(sel, 15); this.selStep = -1; this.armed = null;
    UI.renderAll(); this.dirty();
  },
  undo() { if (!this.hist.length) return; this.fut.push(this.snap); this.restore(this.hist.pop()); this.msg('DESHACER'); UI.refreshUndo(); },
  redo() { if (!this.fut.length) return; this.hist.push(this.snap); this.restore(this.fut.pop()); this.msg('REHACER'); UI.refreshUndo(); },

  /* ── selección ── */
  select(i) {
    if (i === this.sel) return;
    this.sel = i; this.selStep = -1; this.armed = null; this.page = 0;
    AU.send({ t: 'sel', i }); UI.renderAll();
  },
  snd() { return holderOf(this.sel); },
  track(pi) { const pat = this.P.patterns[pi == null ? this.P.cur : pi]; return this.sel >= 0 ? pat.tracks[this.sel] : null; },

  /* ── parámetros ── */
  getN(ref) {
    const d = pref(ref); if (!d) return 0;
    if (this.selStep >= 0 && ref.s === this.sel && ref.s >= 0) { const st = this.track().steps[this.selStep]; if (st && st.k && st.k[ref.id] != null) return st.k[ref.id]; }
    return pNorm(d.P, d.hold[d.key]);
  },
  isLocked(ref) { if (this.selStep < 0 || ref.s !== this.sel || ref.s < 0) return false; const st = this.track().steps[this.selStep]; return !!(st && st.k && st.k[ref.id] != null); },
  setN(ref, n, opt) {
    const d = pref(ref); if (!d) return;
    n = clamp(n, 0, 1);
    if (this.selStep >= 0 && ref.s === this.sel && ref.s >= 0 && !(opt && opt.base)) {
      const tr = this.track(), st = tr.steps[this.selStep];
      if (st) { st.k = st.k || {}; st.k[ref.id] = n; this.markPat(this.P.cur); LV.focus(ref, true); UI.lockDirty = true; UI.refreshSteps(); return; }
    }
    if (this.st && this.st.pl && UI.recArm && !(opt && opt.base)) { this.motion(ref, n); LV.focus(ref); return; }
    const v = pDen(d.P, n);
    d.hold[d.key] = d.P.curve === 'lin' || d.P.curve === 'exp' ? v : Math.round(v);
    this.touchS(ref.s);
    if (d.key === 'engine' || d.key === 'trig' || d.key === 'flt_type' || d.key === 'shape' || (d.kind === 'f' && d.key === 'type')) UI.renderEditor();
    if (ref.id === 'engine') LV.engineView = true;
    LV.focus(ref);
  },
  setV(ref, v) { const d = pref(ref); if (d) this.setN(ref, pNorm(d.P, v)); },
  /* grabación de movimiento → carril de automatización */
  motion(ref, n) {
    const P = this.P, pat = P.patterns[this.playPat], lanes = ref.s < 0 ? pat.master.lanes : pat.tracks[ref.s].lanes;
    let ln = lanes[ref.id];
    if (!ln) ln = lanes[ref.id] = { len: Math.max(1, Math.round(patLen(pat))), pts: [] };
    const pos = ((this.livePos() % ln.len) + ln.len) % ln.len, q = Math.round(pos * 4) / 4;
    const last = this.lastLane && this.lastLane.id === ref.id ? this.lastLane.t : q;
    ln.pts = ln.pts.filter((p) => !(last <= q ? p[0] > last && p[0] <= q : p[0] > last || p[0] <= q));
    ln.pts = ln.pts.filter((p) => Math.abs(p[0] - q) > 0.01);
    ln.pts.push([q, n, 0]); ln.pts.sort((a, b) => a[0] - b[0]);
    this.lastLane = { id: ref.id, t: q };
    this.markPat(this.playPat); UI.refreshLanes();
  },
  livePos() { const st = this.st; if (!st || !st.pl) return 0; return st.pos + (AU.ctx.currentTime * AU.sr - st.time) / ((AU.sr * 60) / this.P.bpm / 4); },

  /* ── moduladores ── */
  addMod(type) {
    const s = this.snd(), m = newMod(type, s.nid++); s.mods.push(m); this.armed = { s: this.sel, id: m.id };
    this.touchS(this.sel); this.commit(); UI.renderEditor(); this.msg(MOD_T[type].name + ' AÑADIDO');
  },
  delMod(id) {
    const s = this.snd(); s.mods = s.mods.filter((m) => m.id !== id);
    for (const m of s.mods) m.routes = m.routes.filter((r) => !r.to.startsWith('m' + id + '.'));
    this.purgeRefs('m' + id + '.');
    if (this.armed && this.armed.id === id) this.armed = null;
    this.touchS(this.sel); this.commit(); UI.renderEditor();
  },
  route(si, mid, to, d) {
    const s = holderOf(si), m = s.mods.find((x) => x.id === mid); if (!m) return;
    if (to === 'm' + mid + '.' || to.startsWith('m' + mid + '.')) { this.msg('NO A SÍ MISMO'); return; }
    let r = m.routes.find((x) => x.to === to);
    if (!r) { r = { to, d: d == null ? 0.5 : d }; m.routes.push(r); } else if (d != null) r.d = d;
    this.touchS(si); return r;
  },
  unroute(si, mid, to) { const s = holderOf(si), m = s.mods.find((x) => x.id === mid); if (!m) return; m.routes = m.routes.filter((r) => r.to !== to); this.touchS(si); this.commit(); UI.renderEditor(); },
  /* ── efectos ── */
  addFx(type) { const s = this.snd(), f = newFx(type, s.nid++); s.fx.push(f); this.touchS(this.sel); this.commit(); UI.renderEditor(); },
  delFx(id) {
    const s = this.snd(); s.fx = s.fx.filter((f) => f.id !== id);
    for (const m of s.mods) m.routes = m.routes.filter((r) => !r.to.startsWith('f' + id + '.'));
    this.purgeRefs('f' + id + '.'); this.touchS(this.sel); this.commit(); UI.renderEditor();
  },
  moveFx(id, d) { const s = this.snd(), i = s.fx.findIndex((f) => f.id === id), j = i + d; if (i < 0 || j < 0 || j >= s.fx.length) return; [s.fx[i], s.fx[j]] = [s.fx[j], s.fx[i]]; this.touchS(this.sel); this.commit(); UI.renderEditor(); },
  purgeRefs(prefix) {
    for (const pat of this.P.patterns) {
      const lanes = this.sel < 0 ? [pat.master.lanes] : [pat.tracks[this.sel].lanes];
      for (const ln of lanes) for (const k in ln) if (k.startsWith(prefix)) delete ln[k];
      if (this.sel >= 0) for (const st of pat.tracks[this.sel].steps) if (st && st.k) for (const k in st.k) if (k.startsWith(prefix)) delete st.k[k];
    }
    this.P.patterns.forEach((_, i) => this.markPat(i));
  },

  /* ── secuenciador ── */
  stepAt(k) { const tr = this.track(); return tr ? tr.steps[k] : null; },
  toggleStep(k, on) {
    const tr = this.track(); if (!tr) return;
    const s = this.snd(), cur = tr.steps[k];
    if (on === false || (on == null && cur)) { tr.steps[k] = null; if (this.selStep === k) this.selStep = -1; }
    else if (!cur) tr.steps[k] = newStep(s.mode === 'chop' ? (k % Math.max(1, s.slices.length)) : 60 + (this.oct - 4) * 12, 0.8);
    this.markPat(this.P.cur); UI.refreshSteps(); UI.refreshPads();
  },
  setPattern(pi) {
    this.P.cur = pi; this.selStep = -1; this.touchG();
    if (!(this.st && this.st.pl)) this.playPat = pi;
    UI.refreshPatterns(); UI.refreshSteps(); UI.refreshLanes(); UI.refreshPads(); this.dirty();
  },
  /* ── reproducción ── */
  play() { this.flush(); AU.send({ t: 'play' }); if (AU.ctx.state !== 'running') AU.ctx.resume(); UI.refreshTransport(true); },
  stop() { AU.send({ t: 'stop' }); UI.refreshTransport(false); this.lastLane = null; },
  toggle() { if (this.st && this.st.pl) this.stop(); else this.play(); },
  /* notas en directo */
  noteOn(i, n, v) {
    const key = i + ':' + n; if (this.held.has(key)) return;
    this.held.set(key, 1); AU.send({ t: 'on', i, n, v: v == null ? 0.85 : v }); LV.kick();
  },
  noteOff(i, n) { const key = i + ':' + n; if (!this.held.has(key)) return; this.held.delete(key); AU.send({ t: 'off', i, n }); },
  allOff() { for (const k of this.held.keys()) { const [i, n] = k.split(':').map(Number); AU.send({ t: 'off', i, n }); } this.held.clear(); },
  punch(id) { this.punchHeld = id; AU.send({ t: 'punch', id }); },
};

/* ══════════════════════════════════════════════════════════════════
   GRILLO · vistas de la pantalla principal y mascota
   ══════════════════════════════════════════════════════════════════ */
const LV = {
  scr: null, W: 440, H: 264, foc: null, focT: -1e9, focLock: false, msgS: '', msgT: -1e9, engineView: false, kickT: -1e9,
  beat: -1, bar: -1, twT: -1e9, jumpT: -1e9, shTmp: new Float64Array(4),
  init(cv) { this.scr = new LCDK.Screen(cv, this.W, this.H); },
  focus(ref, lock) { this.foc = ref; this.focT = performance.now(); this.focLock = !!lock; },
  focusWave() { this.foc = null; this.focT = -1e9; },
  message(t) { this.msgS = String(t); this.msgT = performance.now(); },
  kick() { this.kickT = performance.now(); },
  frame(now) {
    const s = this.scr; if (!s || !App.P) return;
    s.resize(); s.begin();
    const st = App.st;
    if (st && st.pl) {
      const b = Math.floor(st.pos / 4), br = Math.floor(st.pos / 16);
      if (b !== this.beat) { this.beat = b; this.twT = now; }
      if (br !== this.bar) { this.bar = br; this.jumpT = now; }
    } else { this.beat = -1; this.bar = -1; }
    this.statusRow(now); this.titleRow();
    if (now - this.msgT < 1700) this.vMsg(now);
    else if (App.rec.on) this.vRec(now);
    else if (App.sel >= 0 && App.punchHeld > 0) this.vPunch(now, App.punchHeld);
    else if (this.foc && now - this.focT < 1700 && pref(this.foc)) this.vParam(now);
    else if (App.sel < 0) this.vMaster(now);
    else this.vSound(now);
    this.stepsRow(now); this.mascot(now);
    s.end();
  },
  /* ── fila de estado ── */
  statusRow(now) {
    const s = this.scr, st = App.st, P = App.P, pl = !!(st && st.pl), blink = Math.floor(now / 260) % 2 === 0;
    s.icon('play', 10, 9, 12, pl);
    s.icon('rec', 29, 9, 12, (UI.recArm && (!pl || blink)) || (App.rec.on && blink));
    s.icon('chain', 47, 9, 16, P.chainMode);
    s.icon('mic', 70, 8, 14, !!AU.mic);
    s.icon('metro', 90, 9, 12, P.metro);
    s.text('PAT', 112, 11, 1.1); s.digits(pad2((pl ? App.playPat : P.cur) + 1), 133, 7, 19, 'o');
    s.text('BPM', 170, 11, 1.1); s.digits(P.bpm.toFixed(1).padStart(5, ' '), 191, 7, 19, 'o');
    // con el master elegido, el paso es el de su carril de efectos (el mismo que marca la rejilla)
    const mk = pl && App.sel < 0 && P.patterns[App.playPat] ? Math.floor(st.pos) % Math.max(1, Math.min(64, Math.ceil(patLen(P.patterns[App.playPat])))) : -1;
    const k = pl && App.sel >= 0 && st.stp[App.sel] >= 0 ? pad2(st.stp[App.sel] + 1) : mk >= 0 ? pad2(mk + 1) : '--';
    s.text('PASO', 268, 11, 1.1); s.digits(k, 296, 7, 19, 'o');
    const lv = (v) => Math.round(Math.min(1, Math.sqrt(v || 0) * 1.05) * 12);
    const L = lv(st && st.mL), R = lv(st && st.mR);
    for (let i = 0; i < 12; i++) { s.rect(338 + i * 7.6, 8, 5.6, 6, i < L ? 'o' : 'g'); s.rect(338 + i * 7.6, 17, 5.6, 6, i < R ? 'o' : 'g'); }
    s.tiny('1', 432, 8, 1); s.tiny('2', 432, 17, 1);
  },
  titleRow() {
    const s = this.scr, A = App;
    if (A.sel < 0) { s.text('MS MASTER', 10, 33, 2, 'o', { ghost: true, cells: 17 }); s.text('EFECTOS·PUNCH', 430 - s.tw('EFECTOS·PUNCH', 1.2), 37, 1.2); return; }
    const snd = A.P.sounds[A.sel];
    s.text(pad2(A.sel + 1) + ' ' + (snd.name || 'SONIDO ' + pad2(A.sel + 1)).slice(0, 14), 10, 33, 2, 'o', { ghost: true, cells: 17 });
    const e = ENGINES[Math.round(snd.p.engine)], md = snd.mode === 'chop' ? 'TROCEADO' : 'MELÓDICO';
    s.text(e, 430 - s.tw(e, 1.2), 33, 1.2); s.text(md, 430 - s.tw(md, 1), 44, 1, 'd');
  },
  /* ── vistas ── */
  sample() { const snd = App.P.sounds[App.sel]; if (!snd || !snd.zones.length) return null; return App.samples.get(snd.zones[0].sid) || null; },
  wave(x0, y0, cols, rows, pw, ph, sm, opt) {
    const s = this.scr, snd = App.P.sounds[App.sel], pk = sm.an.peaks, nb = pk.length / 2, half = rows >> 1;
    let mx = 1e-6; for (let i = 0; i < pk.length; i++) mx = Math.max(mx, Math.abs(pk[i]));
    const amp = new Float32Array(cols);
    for (let c = 0; c < cols; c++) { const a = Math.floor((c * nb) / cols), b = Math.max(a + 1, Math.floor(((c + 1) * nb) / cols)); let m = 0; for (let i = a; i < b; i++) m = Math.max(m, -pk[i * 2], pk[i * 2 + 1]); amp[c] = Math.min(1, m / mx); }

      case 'patA': this.chainAdd = !this.chainAdd; this.chainNew = true; A.msg(this.chainAdd ? 'TOCA PATRONES PARA LA CADENA' : 'CADENA ' + P.chain.map((x) => pad2(x + 1)).join(' ')); this.refresh(); break;
      case 'patB': P.chainMode = !P.chainMode; A.touchG(); A.commit(); A.msg(P.chainMode ? 'TOCAR CADENA' : 'TOCAR PATRÓN'); this.refresh(); break;
      case 'fxB': this.fxBank = 1 - this.fxBank; A.msg('BANCO ' + 'AB'[this.fxBank]); this.refresh(); break;
    }
  },
  ctxLong(w) {
    const A = App;
    if ((this.mode === 'steps' || this.mode === 'sound') && w === 'B') { A.redo(); NAT.buzz(true); this.refresh(); }
    else if (this.mode === 'steps' && w === 'A') { App.set.follow = App.set.follow === false; this.saveSet(); A.msg(App.set.follow === false ? 'LA VISTA NO SIGUE' : 'LA VISTA SIGUE AL PLAY'); }
    else if (this.mode === 'sound' && w === 'A') { const s = A.snd(); s.solo = !s.solo; A.touchS(A.sel); A.commit(); A.msg(s.solo ? 'SOLO' : 'SIN SOLO'); this.refresh(); }
  },
  refreshFoot() {
    if (!this.built || !App.P) return;
    const A = App, P = A.P, tr = A.track(), set = (id, b, i, on, dis) => { const el = $(id); el.children[1].textContent = b; el.children[2].textContent = i; el.classList.toggle('on', !!on); el.classList.toggle('dis', !!dis); };
    const len = tr ? tr.len : 16, np = Math.max(1, Math.ceil(len / 16));
    switch (this.mode) {
      case 'steps': set('#bA', 'PÁG ' + (A.page + 1) + '/' + np, np > 1 ? 'PASOS ' + (A.page * 16 + 1) + '-' + Math.min(len, A.page * 16 + 16) : 'MANTÉN: SEGUIR', false, false); set('#bB', 'DESHACER', 'MANTÉN: REHACER'); break;
      case 'sound': set('#bA', 'SILENCIO', 'MANTÉN: SOLO', A.snd().mute || A.snd().solo); set('#bB', 'DESHACER', 'MANTÉN: REHACER'); break;
      case 'play': set('#bA', 'OCT −', 'OCTAVA ' + A.oct); set('#bB', 'OCT +', 'OCTAVA ' + A.oct); break;
      case 'pat': set('#bA', 'CADENA', this.chainAdd ? 'TOCA PATRONES' : P.chain.map((x) => pad2(x + 1)).join(' ').slice(0, 18), this.chainAdd); set('#bB', 'TOCAR CADENA', P.chainMode ? 'ENCENDIDO' : 'APAGADO', P.chainMode); break;
      case 'fx': set('#bA', 'CLEAR', 'MANTÉN: BORRA', A.punchHeld === -1); set('#bB', 'BANCO ' + 'AB'[this.fxBank], 'CAMBIAR'); break;
    }
  },

  /* ── bloqueo (modo bolsillo) ── */
  setLock(on) { this.locked = on; document.body.classList.toggle('locked', on); if (on) { App.allOff(); App.punch(0); App.msg('BLOQUEADO'); } },
  lockEvents() {
    const ov = $('#lockov'), bar = ov.querySelector('.lkbar i'); let t = null, raf = 0;
    const stop = () => { cancelAnimationFrame(raf); t = null; bar.style.width = '0'; };
    ov.addEventListener('pointerdown', (e) => { e.preventDefault(); t = performance.now(); const go = () => { const f = (performance.now() - t) / 900; bar.style.width = Math.min(100, f * 100) + '%'; if (f >= 1) { stop(); this.setLock(false); NAT.buzz(true); App.msg('DESBLOQUEADO'); } else raf = requestAnimationFrame(go); }; go(); });
    ov.addEventListener('pointerup', stop); ov.addEventListener('pointercancel', stop);
  },

  /* ── inclinar el móvil ── */
  async toggleTilt() {
    if (!this.tiltOn) {
      if (!this.last) { App.msg('TOCA ANTES UN FADER'); return; }
      try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') { App.msg('SIN PERMISO'); return; } } } catch (e) {}
      if (!this._tiltL) { this._tiltL = (e) => { if (!this.tiltOn || e.gamma == null) return; this.tiltV = clamp((e.gamma + 35) / 70, 0, 1); }; addEventListener('deviceorientation', this._tiltL); }
      this.tiltOn = true; App.msg('INCLINA: ' + this.last.label);
    } else { this.tiltOn = false; App.commit(); App.msg('INCLINAR APAGADO'); }
    $('#bTilt').classList.toggle('on', this.tiltOn);
  },

  /* ── hojas: patrón, sonido, menú ── */
  patSheet(i) {
    const A = App, P = A.P, b = (t, f, cls) => h('button', { class: 'row ' + (cls || ''), onclick: () => { NAT.buzz(); this.closeModal(); f(); } }, t);
    this.modal('PATRÓN ' + pad2(i + 1), h('div', { class: 'list' },
      b('Copiar patrón', () => { A.clip.pat = JSON.parse(JSON.stringify(P.patterns[i])); A.msg('PATRÓN COPIADO'); }),
      b('Pegar aquí', () => { if (!A.clip.pat) return A.msg('NADA COPIADO'); P.patterns[i] = JSON.parse(JSON.stringify(A.clip.pat)); A.markPat(i); A.commit(); this.refresh(); }, A.clip.pat ? '' : 'dis'),
      b('Añadir a la cadena', () => { P.chain.push(i); A.touchG(); A.commit(); A.msg('CADENA ' + P.chain.map((x) => pad2(x + 1)).join(' ')); this.refresh(); }),
      b('Borrar patrón', () => { if (!confirm('¿Borrar el patrón ' + pad2(i + 1) + '?')) return; P.patterns[i] = newPattern(); A.markPat(i); A.commit(); this.refresh(); }, 'danger')));
  },
  soundSheet(i) {
    const A = App, s = A.P.sounds[i], b = (t, f, cls) => h('button', { class: 'row ' + (cls || ''), onclick: () => { NAT.buzz(); this.closeModal(); f(); } }, t);
    if (A.sel !== i) A.select(i);
    this.modal(pad2(i + 1) + ' ' + (s.name || 'SONIDO'), h('div', { class: 'list' },
      b('Cargar audio del móvil', () => this.pickAudio(i)),
      b('Usar una muestra guardada', () => this.samplePicker(i)),
      h('p', { class: 'note' }, 'Para grabar con el micro: mantén pulsado GRABAR (el sonido elegido recibe la grabación).'),
      b(s.mode === 'mel' ? 'Pasar a TROCEADO (un trozo por tecla)' : 'Pasar a MELÓDICO (una nota por tecla)', () => this.setSndMode(s.mode === 'mel' ? 'chop' : 'mel')),
      b(s.mute ? 'Quitar silencio' : 'Silenciar', () => { s.mute = !s.mute; A.touchS(i); A.commit(); this.refresh(); }),
      b(s.solo ? 'Quitar solo' : 'Solo', () => { s.solo = !s.solo; A.touchS(i); A.commit(); this.refresh(); }),
      b('Renombrar', () => { const n = prompt('Nombre del sonido', s.name || ''); if (n != null) { s.name = n.toUpperCase().slice(0, 14); A.touchS(i); A.commit(); this.refresh(); } }),
      b('Copiar sonido', () => { A.clip.snd = JSON.parse(JSON.stringify(s)); A.msg('SONIDO COPIADO'); }),
      b('Pegar sonido aquí', () => { if (!A.clip.snd) return; A.P.sounds[i] = Object.assign(JSON.parse(JSON.stringify(A.clip.snd))); A.touchS(i); A.commit(); this.refresh(); }, A.clip.snd ? '' : 'dis'),
      b('Borrar sus pasos en este patrón', () => { const tr = A.P.patterns[A.P.cur].tracks[i]; tr.steps = new Array(64).fill(null); A.selStep = -1; A.markPat(A.P.cur); A.commit(); this.refresh(); }, 'danger')));
  },
  setSndMode(mode) {
    const A = App, si = A.sel, s = A.snd(); if (s.mode === mode) return;
    s.mode = mode;
    for (const z of s.zones) { const sm = A.samples.get(z.sid); if (!sm) continue; if (mode === 'mel') { z.root = sm.an.root; z.cents = sm.an.cents; } else { z.root = 60; z.cents = 0; } }
    const sm = s.zones[0] && A.samples.get(s.zones[0].sid);
    if (mode === 'chop' && sm && s.slices.length < 2) s.slices = sm.an.slices.slice();
    if (mode === 'chop') s.p.poly = 0;
    for (const pat of A.P.patterns) for (const st of pat.tracks[si].steps) if (st) st.n = st.n.map((n) => (mode === 'chop' ? clamp(n - 60, 0, 15) : 60 + n));
    A.P.patterns.forEach((_, i) => A.markPat(i));
    A.touchS(si); A.commit(); A.msg(mode === 'chop' ? 'TROCEADO' : 'MELÓDICO'); this.refresh();
  },
  pickAudio(i) {
    const inp = h('input', { type: 'file', accept: 'audio/*' });
    inp.addEventListener('change', () => { if (inp.files.length) App.importFiles(Array.from(inp.files), i); });
    inp.click();
  },
  samplePicker(i) {
    const A = App, list = A.lib.slice().sort((a, b) => (b.created || 0) - (a.created || 0));
    const box = h('div', { class: 'list' });
    if (!list.length) box.append(h('p', { class: 'note' }, 'Aún no hay muestras guardadas. Graba con el micro o carga un audio.'));
    for (const m of list) box.append(h('button', { class: 'row smp', onclick: async () => { NAT.buzz(); this.closeModal(); await A.assign(i, m.id); A.msg(m.name.slice(0, 18)); } }, h('b', null, m.name), h('i', null, (m.dur || 0).toFixed(1) + ' S · ' + (m.src || ''))));
    this.modal('MUESTRAS GUARDADAS', box);
  },
  saveSet() { try { localStorage.setItem('grillo.set', JSON.stringify(App.set)); } catch (e) {} },
  menu() {
    const A = App, S = A.set, b = (t, f, cls) => h('button', { class: 'row ' + (cls || ''), onclick: () => { NAT.buzz(); this.closeModal(); f(); } }, t);
    const seg = (opts, get, set) => { const el = h('div', { class: 'seg' }); const d = () => { el.textContent = ''; opts.forEach(([v, t]) => el.append(h('button', { class: get() === v ? 'on' : '', onclick: () => { NAT.buzz(); set(v); this.saveSet(); d(); } }, t))); }; d(); return el; };
    const row = (l, c) => h('div', { class: 'srow' }, h('label', null, l), c);
    const body = h('div', { class: 'menu' },
      h('h4', null, 'PROYECTO · ' + (A.P.name || 'SIN TÍTULO')),
      h('div', { class: 'list' },
        b('Exportar audio (WAV o MP3)', () => IO.exportDialog()),
        b('Guardar / compartir proyecto (.grillo)', () => IO.save()),
        b('Abrir proyecto (.grillo)', () => IO.open()),
        b('Renombrar proyecto', () => { const n = prompt('Nombre del proyecto', A.P.name || ''); if (n != null) { A.P.name = n.toUpperCase().slice(0, 24); A.commit(); A.save(); A.msg(A.P.name); } }),
        b('Proyecto vacío', () => IO.newEmpty()),
        b('Cargar la demo', () => IO.newDemo())),
      h('h4', null, 'SONIDO ' + pad2(A.sel + 1)),
      h('div', { class: 'list' },
        b('Cargar audio del móvil', () => this.pickAudio(A.sel)),
        b('Usar una muestra guardada', () => this.samplePicker(A.sel))),
      h('h4', null, 'AJUSTES'),
      row('Tema', seg([['grafito', 'GRAFITO'], ['verde', 'VERDE'], ['hueso', 'HUESO']], () => S.theme || 'grafito', (v) => { S.theme = v; this.applyTheme(); })),
      row('Metrónomo', seg([[false, 'NO'], [true, 'SÍ']], () => !!A.P.metro, (v) => { A.P.metro = v; A.touchG(); })),
      row('Grabar desde', seg([[0, 'MICRO'], [1, 'LO QUE SUENA']], () => S.recSrc || 0, (v) => { S.recSrc = v; })),
      row('Canales al grabar', seg([[false, 'ESTÉREO'], [true, 'MONO']], () => !!S.recMono, (v) => { S.recMono = v; })),
      row('Empezar al detectar sonido', seg([[0, 'NO'], [-40, 'SÍ']], () => S.recThr || 0, (v) => { S.recThr = v; })),
      row('Recortar silencios', seg([[true, 'SÍ'], [false, 'NO']], () => S.trim !== false, (v) => { S.trim = v; })),
      row('Normalizar', seg([[true, 'SÍ'], [false, 'NO']], () => S.norm !== false, (v) => { S.norm = v; })),
      row('Vibración', seg([[true, 'SÍ'], [false, 'NO']], () => S.haptic !== false, (v) => { S.haptic = v; })),
      row('Pantalla encendida mientras suena', seg([[true, 'SÍ'], [false, 'NO']], () => S.awake !== false, (v) => { S.awake = v; NAT.awake(!!(A.st && A.st.pl)); })),
      h('h4', null, 'AYUDA'),
      h('div', { class: 'help' },
        h('p', null, h('b', null, 'PASOS'), ' toca una tecla para poner o quitar un paso. Mantenla para elegir ese paso: los faders cambian solo ese paso (p-lock). Vuelve a tocarlo para soltarlo.'),
        h('p', null, h('b', null, 'SONIDO'), ' elige y escucha los 16 sonidos. Mantén uno para cargar audio, renombrar o pasarlo a troceado.'),
        h('p', null, h('b', null, 'TOCAR'), ' toca el sonido elegido como un teclado. Con GRABAR encendido y en marcha, lo que toques se escribe en el patrón.'),
        h('p', null, h('b', null, 'PATRÓN'), ' cambia de patrón. CADENA: toca patrones para encadenarlos. En este modo los faders son el tempo, el swing, el volumen y los efectos del master.'),
        h('p', null, h('b', null, 'FX'), ' los 32 punch-in del PO, en dos bancos. Mantén CLEAR para borrar los que grabaste.'),
        h('p', null, h('b', null, 'GRABAR'), ' tócalo para grabar en el patrón (notas, punch-in y movimientos de fader). Mantenlo para grabar con el micro en el sonido elegido.'),
        h('p', null, h('b', null, 'FADERS'), ' arrastra hacia arriba o abajo; doble toque vuelve al valor de fábrica. ‹ › cambian de página. INCLINAR mueve el último fader tumbando el móvil.')),
      h('p', { class: 'note ver' }, 'GRILLO DE BOLSILLO · ' + GRILLO_VER + ' · los proyectos .grillo son los mismos que en el ordenador'));
    this.modal('MENÚ', body, { cls: 'tall' });
  },
  /* archivo listo en el navegador: compartir o descargar (hace falta un toque para el menú de compartir) */
  readySheet(blob, name, now) {
    // se abre un instante después: quien llama suele cerrar su propia hoja justo al terminar
    if (!now) { setTimeout(() => this.readySheet(blob, name, true), 60); return; }
    const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
    const canShare = navigator.canShare && navigator.canShare({ files: [file] });
    const box = h('div', { class: 'list' },
      h('p', { class: 'note' }, name + ' · ' + (blob.size / 1048576).toFixed(1) + ' MB'),
      canShare ? h('button', { class: 'row pri', onclick: async () => { try { await navigator.share({ files: [file], title: name }); this.closeModal(); } catch (e) { if (!/abort/i.test(String(e && e.name))) App.msg('NO SE PUDO COMPARTIR'); } } }, 'Compartir o guardar') : null,
      h('button', { class: 'row', onclick: () => { const a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 120000); this.closeModal(); } }, 'Descargar'));
    this.modal('LISTO', box);
  },
};

/* el resto del programa entrega archivos con IO.dl: en el móvil, compartir */
IO.dl = (blob, name) => NAT.give(blob, name);
IO.open = function () {
  const inp = h('input', { type: 'file', accept: '*/*' });
  inp.addEventListener('change', () => { const f = inp.files[0]; if (!f) return; if (/\.grillo$/i.test(f.name) || f.size > 12) this.openFile(f); });
  inp.click();
};
</script>
<script>
(function () {
  const btn = document.getElementById('pwBtn'), pw = document.getElementById('power');
  const go = async () => {
    if (pw.classList.contains('booting')) return;
    pw.classList.add('booting');
    // iPhone: que suene aunque el interruptor de silencio esté puesto
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try {
      await App.boot(); pw.remove();
      setTimeout(() => LV.message('PULSA PLAY PARA SONAR'), 450);
    } catch (e) { console.error(e); pw.querySelector('.note').textContent = 'No se pudo arrancar el audio: ' + (e && e.message ? e.message : e); pw.classList.remove('booting'); }
  };
  btn.addEventListener('click', go);
  window.GRILLO = { App, UI, AU, LV, IO, NAT };
  // sin conexión (navegador / iPhone); en el APK no hace falta
  const cap = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  if (!cap && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
