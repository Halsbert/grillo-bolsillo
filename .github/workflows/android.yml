# Construye el APK de Android en cada subida (o a mano desde la pestaña Actions)
name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependencias
        run: npm install
      - name: Proyecto Android
        run: npx cap add android
      - name: Permisos, iconos, vertical, pantalla encendida y versión
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' $M
          sed -i 's#android:name=".MainActivity"#& android:screenOrientation="portrait"#' $M
          grep -q RECORD_AUDIO $M
          cp -r android-res/* android/app/src/main/res/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1B1F22</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          MA=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package' $MA)
          printf '%s\n\nimport android.os.Bundle;\nimport android.view.WindowManager;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n    }\n}\n' "$PKG" > $MA
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
      - name: Copiar la app
        run: npx cap sync android
      - name: Firma (siempre la misma, para poder actualizar sin perder los datos)
        id: firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/grillo.jks
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::Falta el secreto KEYSTORE_B64: APK de prueba (solo en Artifacts, no se publica en Releases)."
            keytool -genkeypair -keystore $RUNNER_TEMP/grillo.jks -alias grillo -keyalg RSA -keysize 2048 -validity 12000 -storepass grillo-bolsillo -keypass grillo-bolsillo -dname "CN=Grillo"
          fi
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/grillo.jks \
            -Pandroid.injected.signing.store.password=grillo-bolsillo \
            -Pandroid.injected.signing.key.alias=grillo \
            -Pandroid.injected.signing.key.password=grillo-bolsillo
          cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/Grillo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Grillo-apk
          path: Grillo.apk
      - name: Publicar en Releases
        if: steps.firma.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Grillo de bolsillo 1.${{ github.run_number }}
          body: Descarga Grillo.apk desde el móvil e instálalo encima del anterior (los proyectos se conservan).
          files: Grillo.apk
